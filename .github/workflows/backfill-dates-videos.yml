name: Rattrapage dates vidéos (manuel)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation (1 = rien n est écrit dans Firestore)'
        required: false
        default: '0'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer firebase-admin
        run: npm install firebase-admin

      - name: Compléter date_publication des vidéos existantes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node backfill-dates-videos.js
