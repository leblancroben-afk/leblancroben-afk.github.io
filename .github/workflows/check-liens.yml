name: Vérification des liens (nocturne)

on:
  schedule:
    - cron: '0 23 * * *' # minuit Paris (été) / 1h (hiver)
  workflow_dispatch: {} # bouton "Run workflow" dans l'onglet Actions — lance aussi gen-fiches.js à la suite

permissions:
  contents: write

jobs:
  check-liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin

      - name: Vérifier les liens
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node check-liens.js

      # Chaîné automatiquement : si check-liens.js a fait passer un outil en
      # 'offline'/'warning' (ou l'a fait revenir en 'active'), gen-fiches.js
      # doit tourner tout de suite après pour publier le takeover HTML —
      # sinon la fiche statique reste désynchronisée du statut Firestore
      # jusqu'au prochain run manuel ou planifié de gen-fiches.js.
      - name: Régénérer les fiches (gen-fiches.js)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node gen-fiches.js

      - name: Commit & push si des fichiers ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/ articles/ comparateur/ niches/ tutoriels/ glossaire/ .gen-state.json
          git diff --staged --quiet || git commit -m "🤖 Vérification liens + régénération fiches (auto)"
          git push
