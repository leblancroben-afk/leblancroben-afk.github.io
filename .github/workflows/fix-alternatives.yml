name: FIX alternatives (ponctuel — à supprimer après usage)

on:
  workflow_dispatch: {} # bouton "Run workflow" — pas de cron, jamais automatique

permissions:
  contents: write

jobs:
  fix-alternatives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - name: Corriger le format alternatives
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node fix-alternatives.js
