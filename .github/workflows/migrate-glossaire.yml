name: Migrer glossaire.json vers Firestore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Écrire réellement dans Firestore (sinon simulation seule)'
        required: true
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer firebase-admin
        run: npm install firebase-admin

      - name: Lancer la migration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ inputs.confirm }}" = "true" ]; then
            node migrate-glossaire.js --confirm
          else
            node migrate-glossaire.js
          fi
