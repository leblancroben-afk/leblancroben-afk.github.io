name: Traduction fiches EN/ES (nocturne)

on:
  schedule:
    - cron: '15 23 * * *' # décalé de 15 min pour ne pas tourner en même temps que les autres crons
  workflow_dispatch: {} # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

jobs:
  traduire-fiches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - name: Traduire les fiches manquantes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node traduire-fiches.js
