name: Attribution vidéos YouTube (nocturne)

on:
  schedule:
    # 00:00 heure de Paris = 23:00 UTC (heure d'été CEST) ou 22:00 UTC (hiver CET).
    # GitHub cron ne gère pas les fuseaux : on cale sur 23:00 UTC toute l'année,
    # ce qui donne minuit en été et 1h du matin en hiver — ajustable si besoin.
    - cron: '0 23 * * *'
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions (choisir la branche à tester)
    inputs:
      dry_run:
        description: 'Mode test : calcule sans rien écrire dans Firestore'
        type: boolean
        default: false
      max_outils:
        description: 'Nombre maximum d outils traités'
        default: '25'

permissions:
  contents: write

jobs:
  generer-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer firebase-admin
        run: npm install firebase-admin

      - name: Compléter les vidéothèques (jusqu'à 10 vidéos par outil)
        id: videos
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          MAX_OUTILS: ${{ inputs.max_outils || '25' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generer-videos.js

      # Les fiches ne sont régénérées que si de nouvelles vidéos ont été ajoutées.
      - name: Régénérer les fiches (gen-fiches.js)
        if: steps.videos.outputs.ajoutees > 0
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node gen-fiches.js

      - name: Commit & push si des fichiers ont changé
        if: steps.videos.outputs.ajoutees > 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/ articles/ comparateur/ niches/ tutoriels/ glossaire/ categorie/ data/search-index.json .gen-state.json
          git diff --staged --quiet || git commit -m "🎬 Nouvelles vidéos de la vidéothèque + régénération fiches (auto)"
          git push
